name: Android CI

on:
  push:
    branches: [kotlin]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags to find the last release number

      # Version = the web app's version (overloadVersion in gradle.properties) + a build number:
      # 0.17.1, 0.17.2, ... The count restarts at .1 when overloadVersion changes.
      - name: Work out version
        id: ver
        run: |
          base=$(grep -E '^overloadVersion=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"
          echo "name=$base.$n" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradle-wrapper.jar is checked in, so use a pinned Gradle directly.
      # If you later run `gradle wrapper` and commit the wrapper, change gradle-version
      # to `wrapper` and run ./gradlew instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: overload-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # On pushes to kotlin (not PRs), publish the APK as a GitHub Release.
      - name: Rename APK
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk overload-${{ steps.ver.outputs.name }}.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Overload ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automatic build of `${{ github.sha }}` from the kotlin branch.

            ${{ github.event.head_commit.message }}

            Download the APK below and open it on your phone to install or update.
          files: overload-${{ steps.ver.outputs.name }}.apk
