<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="theme-color" content="#f7f5f1">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Overload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, bright and confident: a training app you're proud to show a friend
   IDEA a rack of competition bumper plates, each colour a training day
   PICTURE photoreal face-on bumper plates for the week, and one big plate that fills as you finish sets
   COLOUR warm white ground with soft colour light, competition red, blue, yellow and green, ink near-black
   TYPE Archivo 800 for titles and numbers + Inter text
   LAYOUT one app column: header, week rack, colour hero for the day, white exercise cards, floating rest pill, tab bar */
:root{color-scheme:light;--bg:#f7f5f1;--ink:#14161c;--mute:#6b7080;--line:#e7e7ec;--card:rgba(255,255,255,.78);--soft:#f2f3f6;--red:#ef2b36;--blue:#2563ff;--yellow:#ffbe0b;--green:#16b65b;--purple:#7c4dff;--black:#23252b;--accent:var(--red);--shadow:0 12px 32px -20px rgba(20,22,40,.35),0 2px 6px -2px rgba(20,22,40,.06)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.bgx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 0% 0%,rgba(239,43,54,.20),transparent 70%),radial-gradient(55% 40% at 100% 8%,rgba(37,99,255,.18),transparent 70%),radial-gradient(70% 45% at 85% 100%,rgba(255,190,11,.20),transparent 70%),radial-gradient(50% 35% at 0% 85%,rgba(22,182,91,.14),transparent 70%),var(--bg)}
.art{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{flex:1;width:100%;max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.num,.wm{font-family:Archivo,Inter,sans-serif;letter-spacing:-.02em;line-height:1.02;margin:0}
h1{font-size:clamp(40px,11vw,60px);font-weight:900}
h2{font-size:32px;font-weight:900}
h3{font-size:20px;font-weight:800}
.num{font-weight:900;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.wm{font-size:26px;font-weight:900;display:flex;align-items:center;gap:8px}
.wm svg{width:30px;height:30px}
.hi{font-size:14px;color:var(--mute);margin-top:2px}
input,select,button,textarea{font:inherit;font-size:16px;color:var(--ink)}
.field,select,textarea{background:var(--soft);border:1.5px solid transparent;border-radius:14px;min-height:48px;padding:0 14px;width:100%}
textarea{padding:12px 14px;min-height:90px;resize:vertical}
.field:focus,select:focus,textarea:focus,.srow input:focus{outline:none;border-color:var(--accent);background:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:14px;border:0;background:var(--soft);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn.go{background:var(--ink);color:#fff}
.btn.acc{background:var(--accent);color:#fff;box-shadow:0 10px 22px -12px var(--accent)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.btn.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px)}
.btn.white{background:#fff;color:var(--ink)}
.iconb{width:44px;padding:0;background:var(--card);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.rack{padding:12px 10px 10px}
.rackh{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px}
.rackh b{font:800 16px Archivo,sans-serif}
.rackh .nav{display:flex;gap:6px}
.rackh .nav button{width:36px;height:36px;border-radius:11px;border:0;background:var(--soft);cursor:pointer;font-weight:800;font-size:18px;color:var(--ink)}
.rackh .nav .today{width:auto;padding:0 12px;font-size:13px}
.plates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.pday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:16px;border:0;background:none;cursor:pointer;transition:background .2s}
.pday svg{width:100%;max-width:58px;aspect-ratio:1;filter:drop-shadow(0 6px 6px rgba(20,22,40,.22))}
.pday .d{font-size:12px;font-weight:700;color:var(--mute)}
.pday .dn{font:800 15px Archivo,sans-serif}
.pday.sel{background:var(--soft)}
.pday.sel .dn{color:var(--accent)}
.pday.now .d{color:var(--accent)}
.hero{position:relative;border-radius:28px;padding:20px 18px 18px;margin-bottom:14px;color:#fff;overflow:hidden;box-shadow:0 22px 44px -24px var(--accent);background:var(--grad)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 100% 0%,rgba(255,255,255,.28),transparent 60%),radial-gradient(60% 50% at 0% 100%,rgba(0,0,0,.18),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.kick{font-size:14px;font-weight:600;opacity:.9}
.hero h1{margin:4px 0 6px}
.bigplate{width:124px;height:124px;pointer-events:none}
.bigplate svg{width:100%;height:100%;filter:drop-shadow(0 14px 16px rgba(0,0,0,.35))}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.hs{background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px)}
.hs .num{font-size:24px}
.hs span{font-size:12px;font-weight:600;opacity:.9}
.hact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ghd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.glbl{font-size:13px;font-weight:800;color:var(--mute);letter-spacing:.01em}
.ex+.ex{border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
.exh{display:flex;align-items:center;gap:10px}
.badge{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:900 14px Archivo,sans-serif;color:#fff;background:var(--accent)}
.exh h3{flex:1}
.tgt{font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.meta{font-size:13px;color:var(--mute);margin:8px 0 8px}
.meta b{color:var(--ink);font-weight:700}
.cue{display:inline-block;background:#fff6da;color:#7a5a00;font-size:13px;font-weight:600;border-radius:10px;padding:4px 10px;margin-bottom:8px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;margin:0 6px 8px 0}
.tag.up{background:#e3f7ec;color:#0f8a45}
.tag.pr{background:#ffe5e7;color:#d1121f}
.shead,.srow{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.shead{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px;text-align:center}
.shead span:first-child{text-align:left}
.srow{margin-bottom:8px}
.srow .n{font:900 18px Archivo,sans-serif;color:#b3b6c2;text-align:center}
.srow .n em{font-style:normal;color:var(--green);font-size:13px}
.srow input{width:100%;height:50px;border:1.5px solid transparent;border-radius:14px;background:var(--soft);text-align:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;transition:background .2s}
.srow input::placeholder{color:#b4b7c2;font-weight:700}
.ck{height:50px;border-radius:14px;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.ck svg{width:24px;height:24px;color:#b4b7c2}
.ck:active{transform:scale(.92)}
.srow.done input{background:#e8f8ef;color:#0b6b35}
.srow.done .ck{background:var(--green);box-shadow:0 8px 16px -10px var(--green)}
.srow.done .ck svg{color:#fff}
.srow.done .n{color:var(--green)}
.xbtn{flex:none;height:34px;min-width:34px;padding:0 8px;border-radius:10px;border:0;background:var(--soft);color:var(--mute);cursor:pointer;display:grid;place-items:center;font-weight:800;font-size:13px}
.xbtn.on{background:#ffe1e3;color:#d1121f}
.exnote{width:100%;min-height:40px;height:40px;margin:2px 0 8px;padding:9px 12px;border-radius:12px;border:1.5px solid transparent;background:var(--soft);font-size:14px;resize:none;overflow:hidden;line-height:1.4}
.exnote:focus{outline:none;border-color:var(--accent);background:#fff}
.lnote{font-size:13px;color:#3b4252;background:#eef2ff;border-radius:10px;padding:5px 10px;margin-bottom:8px}
.hname{display:flex;align-items:center;gap:10px}
.ren{flex:none;width:36px;height:36px;border-radius:12px;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:18px;cursor:pointer}
.rn{margin:6px 0;font:900 28px Archivo,sans-serif;background:rgba(255,255,255,.95)!important;color:var(--ink)}
.bkb{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#fff,#eef2ff)}
.exfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.empty{text-align:center;color:var(--mute);padding:26px 14px}
.empty h3{color:var(--ink);margin-bottom:6px}
.sum{background:linear-gradient(135deg,#16b65b,#00c2a8);color:#fff}
.sum .sub{color:rgba(255,255,255,.9)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.tile{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sum .tile{background:rgba(255,255,255,.2);box-shadow:none;border:0}
.tile .num{font-size:30px}
.tile .sub{font-size:13px}
@media(min-width:560px){.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dock{position:sticky;bottom:0;z-index:5;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(247,245,241,0),rgba(247,245,241,.92) 30%)}
.rest{display:none;align-items:center;gap:10px;max-width:700px;margin:0 auto 8px;padding:8px 8px 8px 10px;border-radius:22px;background:var(--ink);color:#fff;box-shadow:0 18px 40px -18px rgba(0,0,0,.6)}
.rest.on{display:flex}
.ring{width:48px;height:48px;flex:none}
.rest .num{font-size:30px;min-width:2.4em}
.rest .lbl{flex:1;font-size:12px;color:#aeb2bd;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest .lbl b{display:block;color:#fff;font-size:14px}
.rest .rb{min-height:38px;min-width:42px;padding:0 10px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.rest.done{background:var(--green)}
@media(max-width:440px){#rminus{display:none}.rest .num{font-size:26px;min-width:2.2em}.ring{width:42px;height:42px}.rest .rb{min-width:38px;padding:0 8px}}
.rest.done .lbl{color:#eafff2}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:700px;margin:0 auto;padding:6px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);box-shadow:0 14px 36px -18px rgba(20,22,40,.45);border:1px solid rgba(20,22,40,.06)}
.tabs button{height:52px;border-radius:18px;border:0;background:none;font-weight:700;font-size:11.5px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-pressed=true]{color:#fff;background:var(--ink)}
.fig{position:relative;height:230px;margin:8px 0 12px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font:12px Inter,sans-serif;fill:var(--mute)}
.lift{display:grid;grid-template-columns:minmax(0,1fr) 80px 4em;gap:10px;align-items:center;padding:12px 2px;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left}
.lift:first-of-type{border-top:0}
.lift b{display:block;font-size:15px}
.lift .num{font-size:22px;text-align:right}
.lift svg{width:80px;height:30px}
.grn{color:var(--green)}.redt{color:var(--red)}
.hist{width:100%;border-collapse:collapse;font-size:15px}
.hist td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
.hist td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.mrow{display:grid;grid-template-columns:7em minmax(0,1fr) 3em;gap:10px;align-items:center;margin:10px 0;font-size:14px;font-weight:600}
.mrow .t{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.mrow .t i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.vbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;height:140px;margin-top:10px}
.vbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute);font-weight:600}
.vbars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ff6b6b,var(--red));min-height:4px}
.vbars div.cur i{background:linear-gradient(180deg,#5b8cff,var(--blue))}
.heat{display:grid;grid-template-columns:2.8em repeat(7,minmax(0,1fr));gap:5px;font-size:11px;color:var(--mute);align-items:center;max-width:380px;font-weight:600}
.heat i{display:block;aspect-ratio:1;border-radius:6px;background:var(--soft)}
.heat i.td{outline:2px solid var(--ink);outline-offset:-2px}
.prrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.prrow .num{font-size:24px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:10px 0}
.seg button{flex:none;min-height:38px;padding:0 14px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
.days button{height:46px;border-radius:13px;border:0;background:var(--card);box-shadow:var(--shadow);font-weight:800;cursor:pointer;font-size:14px;position:relative}
.days button i{position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%}
.days button[aria-pressed=true]{background:var(--ink);color:#fff}
.erow{border-top:1px solid var(--line);padding:14px 0 6px}
.erow:first-of-type{border-top:0;padding-top:6px}
.erow .r1{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px}
.erow .r2{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.nl{display:grid;gap:3px;font-size:11px;font-weight:700;color:var(--mute);text-align:center}
.nl input,.erow input{width:100%;height:44px;border:1.5px solid transparent;border-radius:12px;background:var(--soft);padding:0 10px;text-align:center}
.erow .r1 input{text-align:left;font-weight:800}
.erow .cuein{text-align:left!important;margin-top:6px;font-size:14px}
.erow select{min-height:44px;font-size:14px;padding:0 8px;align-self:end}
.del{background:var(--soft);border:0;border-radius:12px;color:var(--mute);cursor:pointer;height:44px;font-weight:800}
.form2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.colors button[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.pick{border-radius:20px;background:var(--soft);padding:12px;margin-top:10px}
.plist{max-height:310px;overflow-y:auto;margin-top:8px;display:grid;gap:6px}
.plist button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;min-height:46px;padding:0 14px;border-radius:12px;border:0;background:#fff;cursor:pointer;font-weight:700}
.plist button span{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.tpl{display:grid;gap:10px;margin:14px 0}
.tpl button{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--card);border:0;border-radius:22px;padding:14px;cursor:pointer;box-shadow:var(--shadow)}
.tpl b{display:block;font:800 20px Archivo,sans-serif;margin-bottom:2px}
.tpl svg{width:52px;height:52px}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.note{position:relative;border-radius:22px;padding:14px;min-height:124px;cursor:pointer;text-align:left;border:0;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);color:var(--ink)}
.note b{font:800 18px Archivo,sans-serif;line-height:1.1}
.note p{margin:0;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.note .pin{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;opacity:.6}
.c-red{background:#ffe1e3}.c-yellow{background:#fff1c2}.c-blue{background:#dfe8ff}.c-green{background:#d9f6e5}.c-white{background:#fff}
.swatches{display:flex;gap:8px;margin:10px 0}
.swatches button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed=true]{border:3px solid var(--ink)}
.tl{border-top:1px solid var(--line);padding:12px 0}
.tl p{margin:4px 0 0;white-space:pre-wrap}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.tog:first-of-type{border-top:0}
.sw{position:relative;width:52px;height:32px;border-radius:20px;border:0;background:#d7d9e0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-pressed=true]{background:var(--green)}
.sw[aria-pressed=true]::after{left:23px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-240%);visibility:hidden;background:var(--ink);color:#fff;font-weight:800;padding:11px 18px;border-radius:16px;z-index:20;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
.toast.on{transform:translate(-50%,0);visibility:visible}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--mute);font-weight:700}
.hide{display:none!important}
.sec{margin-top:22px}
.obhero{border-radius:28px;padding:24px 20px;color:#fff;background:linear-gradient(135deg,#ff3d4a,#ff7a3d 55%,#ffbe0b);box-shadow:0 22px 44px -24px #ef2b36;position:relative;overflow:hidden}
.obhero svg.deco{position:absolute;right:-30px;bottom:-30px;width:180px;height:180px;opacity:.95}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 2.0: dark mode (neon) ---------- */

@media(prefers-reduced-motion:reduce){#splash .sp,#splash .sring,#splash .swm,#splash .sl,#splash .lines path{animation:none!important;stroke-dashoffset:0}}
