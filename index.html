<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Overload">
  <meta name="theme-color" content="#f7f5f1">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>Overload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bgx" aria-hidden="true"></div>
  <div id="artimg" class="art artimg" aria-hidden="true"></div>
  <svg id="art" class="art" aria-hidden="true"></svg>
  <div class="toast" id="toast" role="status"></div>
  <div id="sheet"></div>

  <div class="app">
    <div class="wrap">
      <div class="top">
        <div>
          <div class="wm" id="wm">Overload</div>
          <div class="hi" id="hi"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="coachb26 hide" id="coach26" aria-label="Ask Coach"><span class="orb23"><i>✦</i></span><b>Coach</b></button>
          <button class="btn iconb rankb hide" id="rankbtn" aria-label="Your rank and badges"></button>
          <button class="btn iconb" id="gear" aria-label="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
            </svg>
          </button>
        </div>
      </div>
      <main id="main"></main>
    </div>

    <div class="dock" id="dock">
      <div class="rest" id="rest">
        <svg class="ring" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="5"/>
          <circle id="ringp" cx="26" cy="26" r="22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0" transform="rotate(-90 26 26)"/>
        </svg>
        <span class="num" id="rnum">1:30</span>
        <span class="lbl" id="rlbl"><b>Rest</b>Next up</span>
        <button class="rb" id="rminus" aria-label="Minus 15 seconds">−15</button>
        <button class="rb" id="rplus" aria-label="Plus 15 seconds">+15</button>
        <button class="rb" id="rreset" aria-label="Reset rest timer">↺</button>
        <button class="rb" id="rstop" aria-label="Close rest timer">✕</button>
      </div>
      <nav class="tabs">
        <button id="t-log" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
          Today
        </button>
        <button id="t-crew" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6-.2 4.5 1.4 5 4.3"/></svg>
          Crew
        </button>
        <button id="t-me" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg>
          Profile
        </button>
        <button id="t-stats" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
          Stats
        </button>
        <button id="t-plan" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
          Plan
        </button>
      </nav>
    </div>
  </div>
  <!-- App code, one file per feature. They run in this order and share their top-level names. -->
  <script src="js/01-core.js"></script>
  <script src="js/02-rendering.js"></script>
  <script src="js/03-plates.js"></script>
  <script src="js/04-today.js"></script>
  <script src="js/05-plan.js"></script>
  <script src="js/06-stats.js"></script>
  <script src="js/07-rewards.js"></script>
  <script src="js/08-profile.js"></script>
  <script src="js/09-crew.js"></script>
  <script src="js/10-coach.js"></script>
  <script src="js/11-data.js"></script>
  <script src="js/12-settings.js"></script>
  <script src="js/13-extensions.js"></script>
  <script src="js/14-polish.js"></script>
  <script src="js/15-profile-showcase.js"></script>
  <script src="js/16-startup.js"></script>
</body>
</html>
